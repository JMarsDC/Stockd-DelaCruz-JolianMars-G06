{% extends "base.html" %}
{% block title %}{{ mode }} Storage{% endblock %}
{% block content %}
<div class="container">
  <h2>{{ mode }} Storage</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
    <a href="{% url 'storage_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}

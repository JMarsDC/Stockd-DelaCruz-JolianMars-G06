<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stockd{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f6fa; }
    nav { background: #2f3640; padding: 12px 24px; display: flex; gap: 16px; align-items: center; }
    nav a, nav button { color: #fff; text-decoration: none; background: none; border: none; font-size: 16px; cursor: pointer; }
    nav .spacer { flex: 1; }
    .container { max-width: 480px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; }
    .wide { max-width: 800px; }
    .msg { padding: 10px; margin: 10px 24px; border-radius: 4px; }
    .msg.success { background: #d4edda; color: #155724; }
    .msg.error { background: #f8d7da; color: #721c24; }
    form p { display: flex; flex-direction: column; gap: 4px; }
    input { padding: 8px; }
    .btn { padding: 10px 16px; background: #0984e3; color: #fff; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
    .errorlist { color: #c0392b; list-style: none; padding: 0; margin: 0; }
    .helptext { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <nav>
    <strong style="color:#fff">Stockd</strong>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'profile' %}">Profile</a>
      <span class="spacer"></span>
      <span style="color:#fff">{{ user.username }} ({{ user.role }})</span>
      <form method="post" action="{% url 'logout' %}" style="margin:0">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    {% else %}
      <span class="spacer"></span>
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>

  {% for message in messages %}
    <div class="msg {% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</body>
</html>
